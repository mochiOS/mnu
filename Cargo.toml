[package]
name = "mnu"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[workspace]
members = [
    "crates/abi",
    "crates/csprng",
    "crates/metrics",
    "crates/PlugKit/plugkit",
    "crates/PlugKit/plugkit-macros",
    "crates/PlugKit/plugkit-sys",
    "crates/time-core",
    "examples/user",
    "examples/plugkit/test",
]
default-members = [".", "examples/user"]
exclude = ["examples/boot"]

[lib]
path = "src/lib.rs"
test = false
bench = false
doctest = false

[[bin]]
name = "kernel"
path = "src/entry.rs"
test = false
bench = false
required-features = ["kernel-bin"]

[[bin]]
name = "domain-bootstrap"
path = "src/domain_entry.rs"
test = false
bench = false
required-features = ["domain-guest"]

[[bin]]
name = "mochios-domain"
path = "src/mochios_domain.rs"
test = false
bench = false
required-features = ["domain-guest"]

[[bin]]
name = "mochios-system"
path = "src/system_domain_entry.rs"
test = false
bench = false
required-features = ["system-domain"]

[[bin]]
name = "hardware-bootstrap"
path = "src/hardware_bootstrap.rs"
test = false
bench = false
required-features = ["domain-guest"]

[[bin]]
name = "event-bootstrap"
path = "src/event_bootstrap.rs"
test = false
bench = false
required-features = ["domain-guest"]

[[bin]]
name = "grant-bootstrap"
path = "src/grant_bootstrap.rs"
test = false
bench = false
required-features = ["domain-guest"]

[[bin]]
name = "ring-bootstrap"
path = "src/ring_bootstrap.rs"
test = false
bench = false
required-features = ["domain-guest"]

[target.'cfg(any(target_os = "none", target_os = "uefi"))'.dependencies]
linked_list_allocator = "0.10.5"
mochios-csprng = { path = "crates/csprng" }
mochios-time-core = { path = "crates/time-core" }
sha2 = { version = "0.10.8", default-features = false }
spin = "0.9"
x86_64 = "0.15"

[dependencies]
mnu-abi = { path = "crates/abi" }
mnu-metrics = { path = "crates/metrics" }

[features]
default = ["kernel-bin"]
kernel-bin = []
domain-guest = []
system-domain = ["kernel-bin"]
performance-instrumentation = []
frame-allocation-failure-injection = ["performance-instrumentation"]
kcfi = []
cet-ibt = []
cet-shadow-stack = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
