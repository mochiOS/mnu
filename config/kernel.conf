# Generic mnu boot policy example.
# Format: path;read capability;write capability;rights granted without a capability.
capability.path=/bin;fs.read.all;fs.write.all;read,exec,list
capability.path=/tmp;fs.read.tmp;fs.write.tmp;read,exec,list
capability.path=/config;fs.read.all;fs.write.all;read,exec,list
capability.path=/home;fs.read.user;fs.write.user;read,exec,list
