[package]
name = "user"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
mnu-abi = { path = "../../crates/abi" }
mochi-user-syscall = { git = "https://github.com/mochiOS/syscalls" }
mochi-user-platform = { git = "https://github.com/mochiOS/syscalls", default-features = false }
mochios-posix-client = { git = "https://github.com/mochiOS/syscalls", default-features = false, features = ["syscall-endpoint", "launch-arguments"] }
mochios-posix-protocol = { git = "https://github.com/mochiOS/syscalls" }

[[bin]]
name = "user"
path = "src/main.rs"
test = false
bench = false
harness = false

[[bin]]
name = "captest"
path = "src/captest_main.rs"
test = false
bench = false
harness = false
