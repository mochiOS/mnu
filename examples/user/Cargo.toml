[package]
name = "user"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
mnu-abi = { path = "../../crates/abi" }
mochi-user-syscall = { path = "../../../user/crates/syscall" }
mochi-user-platform = { path = "../../../user/crates/platform", default-features = false }
mochios-posix-client = { path = "../../../user/crates/posix-client", default-features = false, features = ["syscall-endpoint", "launch-arguments"] }
mochios-posix-protocol = { path = "../../../user/crates/posix-protocol" }

[[bin]]
name = "user"
path = "src/main.rs"
test = false
bench = false
harness = false

[[bin]]
name = "captest"
path = "src/captest_main.rs"
test = false
bench = false
harness = false
